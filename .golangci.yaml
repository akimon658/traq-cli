version: "2"

linters:
  enable:
    - depguard
    - errcheck
    - mnd
    - revive
    - usetesting
  settings:
    depguard:
      rules:
        main:
          deny:
            - pkg: github.com/google/uuid
              desc: Use uuid package in std, which is available since Go 1.27
    errcheck:
      check-blank: true
      exclude-functions:
        - (*net/http.Server).Serve
        - (*net/http.Server).Close
        - fmt.Fprint
        - fmt.Fprintln
        - os.Remove
        - (*os.File).Close
        - (io.Closer).Close
    revive:
      rules:
        - name: argument-limit
          severity: error
          arguments: [4]
        - name: unused-parameter
          severity: error
    usetesting:
      context-background: true
      context-todo: true
  exclusions:
    rules:
      - path: _test\.go
        linters:
          - errcheck

formatters:
  enable:
    - gofmt
    - goimports
    - golines

  settings:
    goimports:
      local-prefixes:
        - github.com/akimon658/traq-cli
