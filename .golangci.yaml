version: "2"

linters:
  enable:
    - mnd
    - revive
    - usetesting
  settings:
    revive:
      rules:
        - name: unused-parameter
          severity: error
    usetesting:
      context-background: true
      context-todo: true

formatters:
  enable:
    - gofmt
    - goimports
    - golines

  settings:
    goimports:
      local-prefixes:
        - github.com/akimon658/traq-cli
