version: "2"

linters:
  enable:
    - depguard
    - mnd
    - revive
    - usetesting
  settings:
    depguard:
      rules:
        main:
          deny:
            - pkg: github.com/google/uuid
              desc: Use uuid package in std, which is available since Go 1.27
    revive:
      rules:
        - name: argument-limit
          severity: error
          arguments: [4]
        - name: unused-parameter
          severity: error
    usetesting:
      context-background: true
      context-todo: true

formatters:
  enable:
    - gofmt
    - goimports
    - golines

  settings:
    goimports:
      local-prefixes:
        - github.com/akimon658/traq-cli
